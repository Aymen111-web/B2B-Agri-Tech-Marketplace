<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSpice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <radialGradient id="chiliGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <filter id="spiceShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGradSpice)"/>
  <!-- Chili 1 -->
  <path d="M 130 90 C 170 110, 220 160, 210 220 C 200 230, 185 220, 180 200 C 170 160, 140 120, 120 105 Z" fill="url(#chiliGrad)" filter="url(#spiceShadow)"/>
  <path d="M 120 105 C 115 100, 110 90, 105 75 C 115 80, 125 85, 130 90 Z" fill="#15803d"/>
  <!-- Chili 2 -->
  <path d="M 270 95 C 230 115, 180 165, 190 225 C 200 235, 215 225, 220 205 C 230 165, 260 125, 280 110 Z" fill="url(#chiliGrad)" opacity="0.9" filter="url(#spiceShadow)"/>
  <path d="M 280 110 C 285 105, 290 95, 295 80 C 285 85, 275 90, 270 95 Z" fill="#16a34a"/>
  <!-- Pepper seed flakes -->
  <circle cx="160" cy="140" r="4" fill="#fef08a"/>
  <circle cx="240" cy="150" r="4" fill="#fef08a"/>
  <circle cx="200" cy="120" r="5" fill="#fef08a"/>
  <circle cx="170" cy="180" r="4" fill="#fde047"/>
  <circle cx="230" cy="190" r="4" fill="#fde047"/>
  <text x="200" y="270" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18" letter-spacing="1">AROMATIC HIGHLAND SPICES</text>
</svg>
